<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111827">
  <title>Invitation Not Found | Nulo Celebrate</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at top, rgb(255 255 255 / 95%), transparent 45%),
        #f8fafc;
    }

    main {
      width: min(100%, 38rem);
      text-align: center;
    }

    .code {
      margin: 0 0 1rem;
      color: #94a3b8;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    p:last-child {
      max-width: 32rem;
      margin: 1rem auto 0;
      color: #64748b;
      font-size: 1.05rem;
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Invitation Not Found</h1>
    <p>This invitation could not be found. Please check the link you were provided.</p>
  </main>
</body>
</html>
