<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111827">
  <title>Nulo Celebrate</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at top, rgb(255 255 255 / 95%), transparent 45%),
        #f8fafc;
    }

    main {
      width: min(100%, 38rem);
      text-align: center;
    }

    .mark {
      width: 3rem;
      height: 3rem;
      margin: 0 auto 1.5rem;
      display: grid;
      place-items: center;
      border-radius: 0.9rem;
      background: #111827;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    p {
      margin: 1rem auto 0;
      color: #64748b;
      font-size: 1.05rem;
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">N</div>
    <h1>Nulo Celebrate</h1>
    <p>Private event experiences, thoughtfully delivered.</p>
  </main>
</body>
</html>
